<div class="flex h-screen overflow-hidden">

  <aside class="w-[264px] shrink-0 flex flex-col border-r border-line bg-surface">

    <!-- Brand -->
    <div class="flex items-center gap-3 px-6 h-[68px] border-b border-line shrink-0">
      <div class="flex items-center justify-center w-9 h-9 rounded-xl bg-brand-700 text-white shrink-0">
        <span class="material-symbols-rounded" style="font-size:20px">dentistry</span>
      </div>
      <span class="font-display text-lg font-semibold text-ink tracking-tight">OdontoFlow</span>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-5 overflow-y-auto">
      <p class="text-[10px] font-bold text-ink-faint uppercase tracking-[0.12em] px-3 pb-2">Clínica</p>
      @for (item of navItems(); track item.route) {
        <a [routerLink]="item.route" routerLinkActive="nav-item-active" class="nav-item">
          <span class="material-symbols-rounded nav-icon" style="font-size:21px">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- User -->
    <div class="px-3 pb-4 pt-2 border-t border-line shrink-0 relative" (uiClickOutside)="closeMenu()">
      <button type="button" class="flex items-center gap-3 w-full px-2.5 py-2 rounded-xl hover:bg-paper transition-colors text-left"
              [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
        <div class="w-8 h-8 rounded-full bg-brand-50 text-brand-700 flex items-center justify-center shrink-0 font-semibold text-xs">
          {{ initials() }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-medium text-ink truncate leading-tight">{{ userName() }}</p>
          <p class="text-[11px] text-ink-faint leading-tight">{{ roleLabel() }}</p>
        </div>
        <span class="material-symbols-rounded text-ink-faint shrink-0" style="font-size:18px">
          {{ menuOpen() ? 'expand_more' : 'expand_less' }}
        </span>
      </button>

      @if (menuOpen()) {
        <div class="ui-menu-panel" style="position:absolute; bottom:64px; left:12px; right:12px;">
          <a class="ui-menu-item" routerLink="/perfil" (click)="closeMenu()">
            <span class="material-symbols-rounded">person</span> Meu perfil
          </a>
          <a class="ui-menu-item" routerLink="/configuracoes" (click)="closeMenu()">
            <span class="material-symbols-rounded">settings</span> Configurações
          </a>
          <button type="button" class="ui-menu-item is-danger" (click)="closeMenu(); auth.logout()">
            <span class="material-symbols-rounded">logout</span> Sair
          </button>
        </div>
      }
    </div>

  </aside>

  <main class="flex-1 overflow-y-auto bg-paper">
    <router-outlet />
  </main>

</div>
