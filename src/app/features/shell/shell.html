<mat-sidenav-container class="h-screen">

  <mat-sidenav mode="side" opened class="w-60 border-r border-slate-100">
    <div class="flex items-center gap-2 px-4 py-5 border-b border-slate-100">
      <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-primary-700">
        <mat-icon class="text-white text-lg">medical_services</mat-icon>
      </div>
      <span class="font-bold text-slate-800 text-base">OdontoFlow</span>
    </div>

    <mat-nav-list class="pt-2">
      @for (item of navItems; track item.route) {
        <a mat-list-item
          [routerLink]="item.route"
          routerLinkActive="bg-primary-50 text-primary-700 font-medium"
          class="rounded-lg mx-2 mb-1">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="absolute bottom-0 left-0 right-0 p-3 border-t border-slate-100">
      <div class="flex items-center gap-2 px-2 py-1.5">
        <mat-icon class="text-slate-400 text-lg">account_circle</mat-icon>
        <span class="text-sm text-slate-600 truncate flex-1">{{ auth.currentUser()?.email }}</span>
        <button mat-icon-button (click)="auth.logout()" matTooltip="Sair">
          <mat-icon class="text-slate-400">logout</mat-icon>
        </button>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="bg-slate-50">
    <router-outlet />
  </mat-sidenav-content>

</mat-sidenav-container>
