<mat-sidenav-container class="h-screen">

  <mat-sidenav mode="side" opened class="w-[264px] border-r border-line">

    <!-- Brand -->
    <div class="flex items-center gap-3 px-6 h-[68px] border-b border-line">
      <div class="flex items-center justify-center w-9 h-9 rounded-xl bg-brand-700 text-white shrink-0">
        <span class="material-symbols-rounded" style="font-size:20px">dentistry</span>
      </div>
      <span class="font-display text-lg font-semibold text-ink tracking-tight">OdontoFlow</span>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-5 overflow-y-auto">
      <p class="text-[10px] font-bold text-ink-faint uppercase tracking-[0.12em] px-3 pb-2">Clínica</p>
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="nav-item-active"
          class="nav-item">
          <span class="material-symbols-rounded nav-icon" style="font-size:21px">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- User -->
    <div class="px-3 pb-4 pt-2 border-t border-line">
      <div class="flex items-center gap-3 px-2.5 py-2 rounded-xl hover:bg-paper transition-colors">
        <div class="w-8 h-8 rounded-full bg-brand-50 text-brand-700 flex items-center justify-center shrink-0 font-semibold text-xs">
          {{ initials() }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-medium text-ink truncate leading-tight">{{ auth.currentUser()?.email }}</p>
          <p class="text-[11px] text-ink-faint leading-tight">Dentista</p>
        </div>
        <button mat-icon-button (click)="auth.logout()" matTooltip="Sair" class="shrink-0">
          <mat-icon class="text-ink-faint" style="font-size:19px">logout</mat-icon>
        </button>
      </div>
    </div>

  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>

</mat-sidenav-container>
