<mat-sidenav-container class="h-screen">

  <!-- Sidenav -->
  <mat-sidenav mode="side" opened class="w-64 border-r border-slate-200 bg-white flex flex-col">

    <!-- Logo -->
    <div class="flex items-center gap-3 px-5 py-4 border-b border-slate-100">
      <div class="flex items-center justify-center w-9 h-9 rounded-xl bg-primary-700 shrink-0">
        <span class="material-icons text-white" style="font-size:20px">medical_services</span>
      </div>
      <div>
        <p class="font-bold text-slate-800 text-[15px] leading-tight">OdontoFlow</p>
        <p class="text-[11px] text-slate-400 leading-tight">Gestão Odontológica</p>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 p-3 space-y-0.5">
      <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest px-3 py-2">Menu</p>
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-primary-50 !text-primary-700 font-semibold"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors text-sm no-underline">
          <span class="material-icons" style="font-size:20px">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- User -->
    <div class="p-3 border-t border-slate-100">
      <div class="flex items-center gap-2.5 px-3 py-2 rounded-lg bg-slate-50">
        <div class="w-7 h-7 rounded-full bg-primary-100 flex items-center justify-center shrink-0">
          <span class="material-icons text-primary-700" style="font-size:16px">person</span>
        </div>
        <span class="text-xs text-slate-600 truncate flex-1">{{ auth.currentUser()?.email }}</span>
        <button mat-icon-button (click)="auth.logout()" matTooltip="Sair" class="!w-7 !h-7 shrink-0">
          <span class="material-icons text-slate-400" style="font-size:16px">logout</span>
        </button>
      </div>
    </div>

  </mat-sidenav>

  <!-- Main content -->
  <mat-sidenav-content class="flex flex-col bg-slate-50">
    <div class="flex-1 overflow-auto">
      <router-outlet />
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
