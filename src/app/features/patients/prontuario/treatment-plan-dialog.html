<div class="appt-dialog" style="min-width: 520px;">
  <div class="flex items-center justify-between mb-4">
    <h2 class="font-display text-xl text-ink m-0">Novo plano de tratamento</h2>
    <button type="button" class="btn-icon" (click)="close()" tabindex="-1">
      <span class="material-symbols-rounded">close</span>
    </button>
  </div>

  <form [formGroup]="form" class="flex flex-col">
    <div class="field">
      <label class="field-label">Título do plano</label>
      <input class="input" formControlName="title" placeholder="Ex: Reabilitação oral" />
      @if (form.controls.title.invalid && form.controls.title.touched) {
        <span class="field-error">Título é obrigatório</span>
      }
    </div>

    <p class="text-[11px] font-bold text-ink-faint uppercase tracking-[0.1em] mb-2">Procedimentos</p>

    <div formArrayName="items" class="flex flex-col gap-2">
      @for (item of items.controls; track $index) {
        <div [formGroupName]="$index" class="flex items-end gap-2">
          <div class="field flex-1 !mb-0">
            <label class="field-label">Procedimento</label>
            <input class="input" formControlName="description" placeholder="Ex: Canal" />
          </div>
          <div class="field !mb-0" style="width: 80px;">
            <label class="field-label">Dente</label>
            <input class="input" formControlName="tooth" maxlength="3" inputmode="numeric" placeholder="36" />
          </div>
          <div class="field !mb-0" style="width: 130px;">
            <label class="field-label">Valor (R$)</label>
            <input class="input" type="number" formControlName="amount" min="0" step="0.01"
                   (input)="recomputeTotal()" placeholder="0,00" />
          </div>
          <button type="button" class="btn-icon mb-1" (click)="removeItem($index)"
                  [disabled]="items.length === 1" uiTooltip="Remover">
            <span class="material-symbols-rounded">delete</span>
          </button>
        </div>
      }
    </div>

    <button type="button" class="btn btn-stroked self-start mt-3" (click)="addItem()">
      <span class="material-symbols-rounded">add</span> Adicionar procedimento
    </button>

    <div class="flex items-center justify-between mt-5 pt-3 border-t border-line">
      <span class="text-sm text-ink-soft">Total estimado</span>
      <span class="font-display text-xl text-ink">{{ total() | currency:'BRL' }}</span>
    </div>

    <div class="flex justify-end gap-2 mt-4">
      <button type="button" class="btn btn-stroked" (click)="close()">Cancelar</button>
      <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form.invalid || loading()">
        @if (loading()) { <app-spinner [size]="18" /> } @else { Criar plano }
      </button>
    </div>
  </form>
</div>
