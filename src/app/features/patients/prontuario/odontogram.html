<div class="odontogram">

  <!-- Palette -->
  <div class="flex flex-wrap items-center gap-2 mb-6">
    @for (c of conditions; track c.code) {
      <button
        type="button"
        class="cond-chip"
        [class.cond-active]="selected() === c.code"
        (click)="selected.set(c.code)">
        <span class="cond-swatch" [style.background]="c.code === 'HEALTHY' ? '#fff' : c.color"
              [class.cond-swatch-border]="c.code === 'HEALTHY'"></span>
        {{ c.label }}
      </button>
    }
  </div>

  <!-- Arches -->
  <div class="arch">
    <div class="arch-row">
      @for (id of upperRight; track id) {
        <app-tooth [toothId]="id" [state]="toothState(id)" (surface)="apply(id, $event)" />
      }
      <div class="arch-gap"></div>
      @for (id of upperLeft; track id) {
        <app-tooth [toothId]="id" [state]="toothState(id)" (surface)="apply(id, $event)" />
      }
    </div>

    <div class="arch-divider"></div>

    <div class="arch-row">
      @for (id of lowerRight; track id) {
        <app-tooth [toothId]="id" [state]="toothState(id)" (surface)="apply(id, $event)" />
      }
      <div class="arch-gap"></div>
      @for (id of lowerLeft; track id) {
        <app-tooth [toothId]="id" [state]="toothState(id)" (surface)="apply(id, $event)" />
      }
    </div>
  </div>

  <p class="text-xs text-ink-faint mt-5">
    Selecione uma condição acima e clique nas faces do dente. Use <strong>Hígido</strong> para limpar.
  </p>

</div>
