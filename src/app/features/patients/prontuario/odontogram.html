<div class="odontogram">

  <div class="odo-chart dotgrid">
    <!-- Upper arch -->
    <div class="odo-arch">
      <div class="odo-quad odo-quad-end">
        @for (id of upperRight; track id) {
          <app-tooth [toothId]="id" [status]="statusOf(id)" (toothClick)="cycle(id)" />
        }
      </div>
      <div class="odo-mid"></div>
      <div class="odo-quad">
        @for (id of upperLeft; track id) {
          <app-tooth [toothId]="id" [status]="statusOf(id)" (toothClick)="cycle(id)" />
        }
      </div>
    </div>

    <div class="odo-divider">
      <span class="odo-divider-line"></span>
      <span class="odo-divider-label">Superior · Inferior</span>
      <span class="odo-divider-line"></span>
    </div>

    <!-- Lower arch -->
    <div class="odo-arch">
      <div class="odo-quad odo-quad-end">
        @for (id of lowerRight; track id) {
          <app-tooth [toothId]="id" [status]="statusOf(id)" (toothClick)="cycle(id)" />
        }
      </div>
      <div class="odo-mid"></div>
      <div class="odo-quad">
        @for (id of lowerLeft; track id) {
          <app-tooth [toothId]="id" [status]="statusOf(id)" (toothClick)="cycle(id)" />
        }
      </div>
    </div>
  </div>

  <!-- Legend with live counts -->
  <div class="odo-legend">
    @for (s of statuses; track s.code) {
      <div class="odo-legend-item">
        <span class="odo-legend-swatch"
              [style.background]="s.code === 'missing' ? 'transparent' : s.fill"
              [style.border-color]="s.stroke"
              [style.border-style]="s.code === 'missing' ? 'dashed' : 'solid'"></span>
        {{ s.label }}<span class="odo-legend-count">({{ counts()[s.code] }})</span>
      </div>
    }
  </div>

  <p class="odo-hint">
    <span class="material-symbols-rounded" style="font-size:14px">ads_click</span>
    Clique em um dente para alterar o status.
  </p>

</div>
