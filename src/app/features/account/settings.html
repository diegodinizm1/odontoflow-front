<div class="page max-w-2xl">

  <header class="page-head">
    <div>
      <h1 class="page-title">Configurações</h1>
      <p class="page-sub">Dados da clínica e agendamento online</p>
    </div>
  </header>

  @if (loading()) {
    <div class="flex justify-center py-20 text-brand-700"><app-spinner [size]="38" /></div>
  } @else if (data(); as d) {
    <section class="card p-6 mb-5">
      <h2 class="font-display text-lg text-ink mb-4">Clínica</h2>
      <div class="field">
        <label class="field-label">Nome da clínica</label>
        <div class="input flex items-center text-ink">{{ d.clinicName }}</div>
      </div>
    </section>

    <section class="card p-6">
      <div class="flex items-center gap-2 mb-1.5">
        <span class="material-symbols-rounded text-brand-700" style="font-size:20px">link</span>
        <h2 class="font-display text-lg text-ink">Link de agendamento online</h2>
      </div>
      <p class="text-sm text-ink-soft mb-3">Compartilhe com seus pacientes para receber solicitações de horário.</p>
      <div class="flex items-center gap-2">
        <input class="input flex-1 min-w-0" [value]="bookingUrl()" readonly />
        <button class="btn btn-stroked" type="button" (click)="copyLink()">
          <span class="material-symbols-rounded">content_copy</span> Copiar
        </button>
      </div>
    </section>
  }

</div>
