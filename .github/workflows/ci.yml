name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Unit tests + coverage (Vitest)
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend (for the real API)
        uses: actions/checkout@v4
        with:
          repository: diegodinizm1/odontoflow-back
          path: backend

      - name: Start backend stack (API + PostgreSQL + MinIO + stripe-mock)
        working-directory: backend
        run: docker compose --profile full up -d --build

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v3/api-docs || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "API is up"; exit 0; fi
            sleep 5
          done
          echo "API did not become ready in time" >&2
          docker compose -f backend/compose.yaml --profile full logs --tail=100 || true
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests (Playwright)
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Dump backend logs on failure
        if: failure()
        working-directory: backend
        run: docker compose --profile full logs --tail=200
